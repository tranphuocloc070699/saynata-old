name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full suites run on pushes to main and on PRs into main. Other PRs (into feature/local or a feature branch)
  # run only the jobs for the parts they change, so CI is faster while working. Developer's rule, 2026-10-24.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' || steps.full.outputs.full == 'true' }}
      pipeline: ${{ steps.filter.outputs.pipeline == 'true' || steps.full.outputs.full == 'true' }}
      admin: ${{ steps.filter.outputs.admin == 'true' || steps.full.outputs.full == 'true' }}
      extension: ${{ steps.filter.outputs.extension == 'true' || steps.full.outputs.full == 'true' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.full.outputs.full == 'true' }}
      full: ${{ steps.full.outputs.full }}
    steps:
      - id: full
        run: echo "full=${{ github.event_name == 'push' || github.base_ref == 'main' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', '.github/workflows/**']
            pipeline: ['pipeline/**', '.github/workflows/**']
            admin: ['admin/**', '.github/workflows/**']
            extension: ['extension/**', '.github/workflows/**']
            web: ['web/**', '.github/workflows/**']

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # ffmpeg is for the converter test (it is skipped without ffmpeg).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        working-directory: .
      # Tests use H2, a mocked ClaudeService and a fake Pixabay: no Docker or API key needed.
      - run: ./mvnw -B test

  docker:
    name: Backend Docker image
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only: nothing is pushed to a registry. Catches a broken Dockerfile before the VPS does.
      - run: docker build -t saynata-backend:ci backend

  pipeline:
    name: Pipeline tests
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    # The import and export tests need a real Postgres. Each test makes its own schema and drops it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv run --python 3.12 pytest

  admin:
    name: Admin web app
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  extension:
    name: Browser extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      # Type check, then the unpacked extension in dist/ (load it in Brave or Chrome).
      - run: npm run build

  web:
    name: Web app
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Type check and the production build (fetches the Google fonts).
      - run: npm run build

  docs:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
