# Every value that differs between machines comes from an env var (see .env.example).
spring:
  application:
    name: app
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DATABASE_USER:app}
    password: ${DATABASE_PASSWORD:app-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false          # no lazy loading from controllers; load what you need in the service
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks it matches
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}    # "ecs" or "logstash" in prod (JSON lines); empty = readable text locally
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true            # /actuator/health/liveness and /readiness for the load balancer

sentry:
  dsn: ${SENTRY_DSN:}            # empty = Sentry off (local and tests)
  environment: ${APP_ENV:local}
  release: ${APP_RELEASE:dev}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
