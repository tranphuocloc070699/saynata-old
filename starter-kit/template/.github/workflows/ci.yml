name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs run only the jobs for the parts they change; pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      backend: ${{ steps.f.outputs.backend == 'true' || github.event_name == 'push' }}
      web: ${{ steps.f.outputs.web == 'true' || github.event_name == 'push' }}
      python: ${{ steps.f.outputs.python == 'true' || github.event_name == 'push' }}
      ios: ${{ steps.f.outputs.ios == 'true' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend: ['backend/**', '.github/workflows/**']
            web: ['web/**', '.github/workflows/**']
            python: ['python/**', '.github/workflows/**']
            ios: ['ios/**', '.github/workflows/**']

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # stack:backend
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest   # has Docker, so the Testcontainers tests run here
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: make check
  # end-stack

  # stack:web
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: make check
  # end-stack

  # stack:python
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make check
  # end-stack

  # stack:ios
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    defaults: { run: { working-directory: ios } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make check SIM="iPhone 16 Pro"
  # end-stack
