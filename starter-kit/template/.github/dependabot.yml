# Weekly grouped updates, so dependency PRs are few and easy to review.
# new-project.sh removes the blocks for stacks you did not pick.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  # stack:backend
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  # stack:web
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
  # stack:python
  - package-ecosystem: uv
    directory: /python
    schedule: { interval: weekly }
    groups: { minor-and-patch: { update-types: [minor, patch] } }
